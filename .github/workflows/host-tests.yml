# Runs every PC-side (host) test on each pull request and on every push to
# main. Same script as on your PC: sh testing/run_host_tests.sh
# Known failures (listed in testing/run_host_tests.sh) are reported but do
# not fail the check; any new failure does.
name: Host tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          cc --version | head -1
          python3 --version

      - name: Run host tests
        run: |
          set -o pipefail
          sh testing/run_host_tests.sh 2>&1 | tee host-tests.txt

      - name: Upload the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests-output
          path: host-tests.txt
